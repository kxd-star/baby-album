services:
  baby-album:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
    volumes:
      - ./data/uploads:/app/uploads
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
